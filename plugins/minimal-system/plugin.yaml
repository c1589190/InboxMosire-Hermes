name: minimal-system
version: "0.2.1"
description: "Replace Hermes' assembled system prompt with one constant line, mirroring DSH's minimal preset (complete: true + includeRuntimeContext: false). Uses the public llm_request middleware, so nothing about the host prompt builder is patched."
author: "c1589190"
manifest_version: 2
api_version: 1
license: "MIT"
homepage: "https://github.com/c1589190/InboxMosire-Hermes"
tags: ["system-prompt", "minimal", "dsh-parity", "middleware"]
# 注意：Hermes 的 manifest 只认 `provides_hooks`（`hermes_cli/plugins_manifest.py:32-39` 的
# `_KNOWN_MANIFEST_FIELDS`），`llm_request` 是中间件不是 hook，没有可声明的字段；
# 写成 `provides_middleware` 只会让宿主每轮告警 "unknown manifest field(s) ignored"。
config_keys:
  - plugins.entries.minimal-system.settings.enabled
  - plugins.entries.minimal-system.settings.systemPrompt
  - plugins.entries.minimal-system.settings.systemPromptFile
  - plugins.entries.minimal-system.settings.logRewrite
config_schema:
  enabled:
    type: bool
    default: true
    label: 启用极简系统提示词
    description: 关闭后出站请求原样发送（宿主自己拼的那一大段）。
  systemPrompt:
    type: str
    default: "You are a helpful software engineer assistant."
    label: 系统提示词全文
    description: 整段替换，不要写换行以外的格式；YAML 块标量（|）可写多行；每轮发送的字节必须完全一致，否则前缀缓存失效。systemPromptFile 命中时本项只作回落。
  systemPromptFile:
    type: str
    default: ""
    label: 系统提示词文件（md/纯文本）
    description: 非空且可读时整段替换 system prompt，优先级高于 systemPrompt。留空 = $HERMES_HOME/SYSTEM.md（Hermes 自己的目录，与 SOUL.md 同级）；要放别处就写绝对路径。文件按 mtime 缓存，直接改文件即时生效、无需重启；缺失、不可读或为空时回落到 systemPrompt。内容原样发送，不解析 markdown、不剥 front matter。
  logRewrite:
    type: bool
    default: false
    label: 记录每次替换的字数变化
    description: 排查用；只记长度和形状，不记内容，也不含任何凭据。
