name: inbox-wake
version: "0.2.1"
description: "InboxMosire wake adapter for Hermes: SSE cursor + bound-session wake, bounded untrusted summary, occupancy lease, bind/unbind tools and /inbox command. Business inbox tools (list/claim/push/complete/rest) stay in the InboxMosire MCP server — this plugin only turns notifications into a wake."
author: "ConstantinXIV"
manifest_version: 2
api_version: 1
license: "MIT"
homepage: "https://github.com/c1589190/InboxMosire-Hermes"
tags: ["inbox", "wake", "sse", "notifications", "inboxmosire"]
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_tool_call
  - on_session_end
  - on_session_reset
  - on_session_delete
  - on_session_finalize
provides_tools:
  - inbox_adapter_status
  - inbox_adapter_bind
  - inbox_adapter_unbind
  - inbox_adapter_log
config_keys:
  - plugins.entries.inbox-wake.settings.enabled
  - plugins.entries.inbox-wake.settings.apiUrl
  - plugins.entries.inbox-wake.settings.inboxId
  - plugins.entries.inbox-wake.settings.channels
  - plugins.entries.inbox-wake.settings.adapterTokenFile
  - plugins.entries.inbox-wake.settings.wakeMode
  - plugins.entries.inbox-wake.settings.wakeProfile
  - plugins.entries.inbox-wake.settings.summaryEnabled
  - plugins.entries.inbox-wake.settings.summaryMaxItems
  - plugins.entries.inbox-wake.settings.summaryMaxTitleChars
  - plugins.entries.inbox-wake.settings.summaryMaxTotalChars
  - plugins.entries.inbox-wake.settings.wakeContent
  - plugins.entries.inbox-wake.settings.wakeContentMaxChars
  - plugins.entries.inbox-wake.settings.wakeContentTotalChars
  - plugins.entries.inbox-wake.settings.debounceMs
  - plugins.entries.inbox-wake.settings.heartbeatTimeoutSeconds
  - plugins.entries.inbox-wake.settings.sseReadTimeoutSeconds
  - plugins.entries.inbox-wake.settings.pollSeconds
  - plugins.entries.inbox-wake.settings.reconnectBaseMs
  - plugins.entries.inbox-wake.settings.reconnectMaxMs
  - plugins.entries.inbox-wake.settings.wakeBackoffBaseMs
  - plugins.entries.inbox-wake.settings.wakeBackoffMaxMs
  - plugins.entries.inbox-wake.settings.requestTimeoutMs
  - plugins.entries.inbox-wake.settings.maxBindings
  - plugins.entries.inbox-wake.settings.maxBindingsPerInbox
  - plugins.entries.inbox-wake.settings.autoBind
  - plugins.entries.inbox-wake.settings.programTools
  - plugins.entries.inbox-wake.settings.programToolsRequired
config_schema:
  enabled:
    type: bool
    label: 启用 inbox 唤醒
    description: 关闭后不建立任何 SSE 连接（已绑定会话保留状态）。
  apiUrl:
    type: str
    label: InboxMosire API 地址
    description: 默认回环地址；改写前确认不要指向公网。
  inboxId:
    type: str
    label: 默认 inbox
  channels:
    type: list
    label: 默认订阅通道
    description: 空列表表示订阅该 inbox 的全部通道。
  adapterTokenFile:
    type: str
    label: adapter token 文件
    description: 指向一个 0600 权限的文件，内容为 Bearer token；token 不写进 config.yaml。
  wakeMode:
    type: str
    label: 唤醒模式（view-ack 默认 / claim）
  wakeProfile:
    type: str
    label: 唤醒文案档（generic / iibot）
  summaryEnabled:
    type: bool
    label: 唤醒时附带有界摘要
  summaryMaxItems:
    type: int
    label: 摘要/正文最多条目数（1-50，默认 20；服务端按 priority DESC 排序）
  summaryMaxTitleChars:
    type: int
    label: 摘要行标题最多字符数（8-400，默认 120）
  summaryMaxTotalChars:
    type: int
    label: 摘要块总预算（120-20000，默认 6000）
  wakeContent:
    type: str
    label: 唤醒正文策略（off / bounded / full）
    description: bounded/full 会把每条条目的正文渲染进唤醒消息（按 service 的 priority DESC 顺序），目标是一次给够、不再补调 read。
  wakeContentMaxChars:
    type: int
    label: 单条正文最多字符数（80-100000，默认 12000）
  wakeContentTotalChars:
    type: int
    label: 正文段总预算（200-200000，默认 30000）
  debounceMs:
    type: int
    label: 事件去抖（毫秒）
  heartbeatTimeoutSeconds:
    type: int
    label: SSE 心跳超时（秒）
  requestTimeoutMs:
    type: int
    label: HTTP 请求超时（毫秒）
  maxBindings:
    type: int
    label: 同时绑定的会话上限
  maxBindingsPerInbox:
    type: int
    label: 同一 inbox 的活跃绑定上限
    description: 超出的绑定降级为 passive（不订阅、不唤醒）；显式绑定优先。
  programTools:
    type: list
    label: 唤醒前必须存在的程序 MCP 工具
    description: 留空则按 wakeProfile 选组（generic→inbox_list；iibot→qq_conversation_read）。缺 required 时不唤醒，只记 wake.skipped。
  programToolsRequired:
    type: bool
    label: 强制检查程序 MCP 工具
    description: 关闭后退回旧行为（工具缺失也唤醒）。
